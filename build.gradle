plugins {
    id 'idea'
    id 'maven-publish'
    // NeoForge 官方维护的 LegacyForge 插件（ModDevGradle）——用于构建 1.20.1 Forge 模组，
    // 自动处理官方映射、SRG→官方重映射（mod* 配置）、mixin refmap 与 reobf。
    id 'net.neoforged.moddev.legacyforge' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // MinecraftForge 版本（"minecraft_version"-"forge_version"）
    version = "${minecraft_version}-${forge_version}"

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// ── Mixin 配置（ModDevGradle 内置 mixin 支持，无需 MixinGradle 插件）──
// 插件自动接线注解处理器参数（refmap / reobf tsrg），并为 run 注入
// --mixin.config 与 mixin.env.remapRefMap / mixin.env.refMapRemappingFile。
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources.srcDir 'src/generated/resources'

// ── mods.toml：由 src/main/templates 模板生成（MDK 1.20.1-legacy 模式）──
// legacyForge 插件不生成 mods.toml，模板经属性展开后并入资源目录。
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            create_version_range   : create_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

repositories {
    maven { url "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url "https://maven.tterrag.com" } // Registrate (1.20.1 line)
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" } // Geckolib
    mavenCentral()
}

dependencies {
    // ── Create 栈（必需依赖）──────────────────────────────────────
    // mod* 配置会把 SRG 产物自动重映射为官方映射；这些配置不传递，需手动补齐传递依赖。
    modImplementation("com.simibubi.create:create-1.20.1:${create_version}:slim")
    modImplementation("net.createmod.ponder:Ponder-Forge-1.20.1:${ponder_version}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-1.20.1:${flywheel_version}")
    // Registrate 官方 maven 的 1.20.1 产物为 reobf 产物，需走 mod* 重映射
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // Create 的 mixin 依赖 MixinExtras（Forge 1.20.1 不内置）
    implementation("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")

    // Mixin 注解处理器（生成 refmap；MDG 自动注入 reobf/refmap 参数）
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // ── Iron's Spells 'n Spellbooks — 可选兼容（compat/iron 包守卫加载）──
    // 运行时栈（ISS 自身的 mods.toml 依赖 curios/geckolib/irons-lib，dev 环境需齐备）
    modCompileOnly("maven.modrinth:irons-spells-n-spellbooks:${iron_spells_version}")
    modRuntimeOnly("maven.modrinth:irons-spells-n-spellbooks:${iron_spells_version}")
    modRuntimeOnly("maven.modrinth:curios:${curios_version}")
    modRuntimeOnly("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")
    modRuntimeOnly("maven.modrinth:irons-lib:${irons_lib_version}")

    // PlayerAnimator — 可选兼容（PlayerAnimCompat 守卫加载），同上
    modCompileOnly("maven.modrinth:playeranimator:${playeranimator_version}")
    modRuntimeOnly("maven.modrinth:playeranimator:${playeranimator_version}")
}

jar {
    manifest.attributes([
            // 生产环境 mixin 加载必需（Forge 1.20.1 不读 mods.toml 的 [[mixins]]）
            "MixinConfigs": "${mod_id}.mixins.json"
    ])
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
